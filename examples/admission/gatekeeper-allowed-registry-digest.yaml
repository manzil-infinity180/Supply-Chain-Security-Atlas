apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sallowedregistrydigest
spec:
  crd:
    spec:
      names:
        kind: K8sAllowedRegistryDigest
      validation:
        openAPIV3Schema:
          type: object
          properties:
            allowedPrefixes:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sallowedregistrydigest

        containers[container] {
          container := input.review.object.spec.containers[_]
        }

        containers[container] {
          container := input.review.object.spec.template.spec.containers[_]
        }

        violation[{"msg": msg}] {
          container := containers[_]
          image := container.image
          not startswith_any(image, input.parameters.allowedPrefixes)
          msg := sprintf("image %q is not from an approved registry", [image])
        }

        violation[{"msg": msg}] {
          container := containers[_]
          image := container.image
          not contains(image, "@sha256:")
          msg := sprintf("image %q must use a digest, not a mutable tag", [image])
        }

        startswith_any(image, prefixes) {
          prefix := prefixes[_]
          startswith(image, prefix)
        }
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sAllowedRegistryDigest
metadata:
  name: require-approved-registry-digests
spec:
  match:
    kinds:
      - apiGroups:
          - ""
        kinds:
          - Pod
      - apiGroups:
          - apps
        kinds:
          - Deployment
  parameters:
    allowedPrefixes:
      - "ghcr.io/acme/"
