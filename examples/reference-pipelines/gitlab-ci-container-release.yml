stages:
  - build
  - verify
  - release

variables:
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"

build-image:
  stage: build
  script:
    - install -m 0700 -d .secrets dist
    - printf '%s' "$WITNESS_BUILD_KEY" > .secrets/build.pem
    - chmod 0600 .secrets/build.pem
    - witness run --step image-build --outfile dist/image-build.att.json --signer-file-key-path .secrets/build.pem --attestations gitlab,git,environment,docker,oci -- /bin/sh -ec 'docker build --metadata-file dist/docker-metadata.json -t "$IMAGE_TAG" . && docker save "$IMAGE_TAG" -o dist/image.tar'
  artifacts:
    expire_in: 7 days
    paths:
      - dist/image.tar
      - dist/image-build.att.json
      - dist/docker-metadata.json

verify-image-policy:
  stage: verify
  needs:
    - build-image
  script:
    - install -m 0700 -d .secrets
    - printf '%s' "$WITNESS_POLICY_PUB" > .secrets/policy.pub
    - chmod 0600 .secrets/policy.pub
    - witness verify --policy .witness/image-policy-signed.json --publickey .secrets/policy.pub --artifactfile dist/image.tar --attestations dist/image-build.att.json

release-image:
  stage: release
  needs:
    - verify-image-policy
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker load -i dist/image.tar
    - docker push "$IMAGE_TAG"
    - IMAGE_DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_TAG")"
    - cosign sign --key env://COSIGN_PRIVATE_KEY --yes "$IMAGE_DIGEST"
